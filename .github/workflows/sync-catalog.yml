name: Sync catalog

on:
  schedule:
    - cron: "0 5 * * 1" # Mondays 05:00 UTC
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run sync
      - run: bun run bundle
      - name: Open catalog sync PR
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore: sync commandcode catalog"
          title: "chore: sync commandcode catalog"
          body: Automated weekly refresh of `src/catalog.json` (models, reasoning efforts, pricing incl. cache rates) from the published `command-code` package plus the live models endpoint.
          branch: catalog-sync
          delete-branch: true
